[package]
name = "c4tui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Interactive terminal viewer for Structurizr C4 diagrams"
repository = "https://github.com/scshafe/c4tui"
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.21", features = ["derive"] }
libc = "0.2.161"
png = "0.18.0"
resvg = "0.45.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.14.0"

[dev-dependencies]
