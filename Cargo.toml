[package]
name = "c4tui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Interactive terminal viewer for Structurizr C4 diagrams"
repository = "https://github.com/scshafe/c4tui"
homepage = "https://github.com/scshafe/c4tui"
readme = "README.md"
keywords = ["c4", "structurizr", "terminal", "tui", "diagrams"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.21", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0.0"
env_logger = "0.11.8"
env_filter = "0.1"
fontdb = "0.23"
libc = "0.2.161"
log = "0.4.28"
png = "0.18.0"
ratatui = "0.29"
resvg = "0.45.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.14.0"
toml = "0.9.8"
tui-kit = { path = "../tui-kit" }
